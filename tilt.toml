# Receita da funcao distribuida de pedidos (lida pela Tilt, nunca escrita por IA).
# Ao conectar, cada maquina com container constroi a imagem; um push em `main` prepara de novo.
# Cada pedido (ou bloco de pedidos) vira uma parte, que uma maquina puxa e executa na imagem.

[cartucho]
id     = "demo-pedidos"
nome   = "Pedidos -- valida e publica no Google Pub/Sub"
versao = "1.0.0"
modo   = "funcao"

[funcao]
dockerfile = "app/Dockerfile.funcao"
contexto   = "app"
testes     = ["python", "-m", "unittest", "-v", "test_pedidos"]
gatilho    = { push = "main" }

[funcao.ambiente]
PUBSUB_TOPICO = "projects/PROJETO/topics/tilt-demo-pedidos"
GCP_CHAVE     = "cofre:producao.pubsub_chave"

[mapreduce]
split  = { tipo = "by-count", n = 1 }
reduce = { tipo = "jsonl-merge" }

[recursos]
memory_max_mb = 512
deadline_secs = 120

[entrada]
extensoes         = [".json", ".jsonl"]
max_arquivos      = 1
max_arquivo_bytes = 10485760
max_lote_bytes    = 10485760
