# Receita da funcao distribuida de pedidos (lida pela Tilt, nunca escrita por IA).
# A funcao e UM arquivo JavaScript, sem dependencias: a Tilt le o arquivo no commit e cada maquina
# com o conector (Windows ou Linux) o roda com o proprio Node -- sem imagem, sem preparacao.
# Cada pedido (ou bloco de pedidos) vira uma parte, que uma maquina puxa e executa.

[cartucho]
id     = "demo-pedidos"
nome   = "Pedidos -- valida e publica no Google Pub/Sub"
versao = "2.0.0"
modo   = "funcao"

[funcao]
runtime = "node"
arquivo = "funcao.mjs"
gatilho = { push = "main" }

[funcao.ambiente]
PUBSUB_TOPICO = "projects/tilt-examples/topics/tilt-demo-pedidos"
GCP_CHAVE     = "cofre:gcp-pubsub.pubsub_chave"

[mapreduce]
split  = { tipo = "by-count", n = 1 }
reduce = { tipo = "jsonl-merge" }

[recursos]
memory_max_mb = 512
deadline_secs = 120

[entrada]
extensoes         = [".json", ".jsonl"]
max_arquivos      = 1
max_arquivo_bytes = 10485760
max_lote_bytes    = 10485760
